<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080a14" />
      <stop offset="40%" stop-color="#0d1124" />
      <stop offset="100%" stop-color="#060810" />
    </linearGradient>

    <!-- Glowing Orbs Gradients -->
    <radialGradient id="purpleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8a2be2" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#8a2be2" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#080a14" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#00e5ff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#080a14" stop-opacity="0" />
    </radialGradient>

    <!-- Text Gradients -->
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e0e7ff" />
      <stop offset="75%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <linearGradient id="lineGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6" />
    </pattern>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.7; }
      50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.95; }
    }
    @keyframes pulseOrbCyan {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.6; }
      50% { transform: scale(1.2) translate(-25px, 15px); opacity: 0.9; }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -100; }
    }
    .orb-purple {
      animation: pulseOrb 8s ease-in-out infinite alternate;
      transform-origin: 250px 180px;
    }
    .orb-cyan {
      animation: pulseOrbCyan 9s ease-in-out infinite alternate;
      transform-origin: 950px 240px;
    }
    .pill-animated-1 {
      animation: floatPill 5s ease-in-out infinite;
    }
    .pill-animated-2 {
      animation: floatPill 6s ease-in-out 1s infinite;
    }
    .pill-animated-3 {
      animation: floatPill 5.5s ease-in-out 2s infinite;
    }
    .circuit-line {
      stroke-dasharray: 8 12;
      animation: dashMove 15s linear infinite;
    }
    .font-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -1.2px;
    }
    .font-sub {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 400;
    }
    .font-code {
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
    }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="420" fill="url(#bgGradient)" />

  <!-- Grid overlay -->
  <rect width="1200" height="420" fill="url(#gridPattern)" />

  <!-- Dynamic Glowing Orbs (in background) -->
  <circle class="orb-purple" cx="250" cy="180" r="260" fill="url(#purpleGlow)" />
  <circle class="orb-cyan" cx="950" cy="240" r="280" fill="url(#cyanGlow)" />

  <!-- Animated Circuit and Data Lines (background layers) -->
  <g opacity="0.4">
    <path class="circuit-line" d="M 50 100 L 250 100 L 320 170 L 600 170 L 680 90 L 1150 90" fill="none" stroke="url(#lineGrad1)" stroke-width="2" />
    <path class="circuit-line" d="M 80 340 L 350 340 L 430 260 L 780 260 L 850 330 L 1120 330" fill="none" stroke="url(#lineGrad1)" stroke-width="2" />
    <!-- Dynamic Nodes -->
    <circle cx="320" cy="170" r="4" fill="#38bdf8"><animate attributeName="r" values="3;6;3" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="680" cy="90" r="4" fill="#a855f7"><animate attributeName="r" values="3;6;3" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="430" cy="260" r="4" fill="#00e5ff"><animate attributeName="r" values="3;6;3" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="260" r="4" fill="#818cf8"><animate attributeName="r" values="3;6;3" dur="2.8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Animated Dynamic Floating Feature Cards / Pills (Carefully placed so they NEVER obscure title/subtitle) -->
  <!-- Top Left Pill -->
  <g class="pill-animated-1" transform="translate(80, 42)">
    <rect width="165" height="34" rx="17" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="18" cy="17" r="5" fill="#38bdf8" />
    <text x="32" y="22" fill="#93c5fd" font-size="12" class="font-code" font-weight="600">🧠 Episodic Recall</text>
  </g>

  <!-- Top Right Pill -->
  <g class="pill-animated-2" transform="translate(945, 42)">
    <rect width="175" height="34" rx="17" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="18" cy="17" r="5" fill="#c084fc" />
    <text x="32" y="22" fill="#d8b4fe" font-size="12" class="font-code" font-weight="600">🕸️ Temporal Graphs</text>
  </g>

  <!-- Bottom Left Pill -->
  <g class="pill-animated-3" transform="translate(80, 344)">
    <rect width="180" height="34" rx="17" fill="url(#cardGrad)" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="18" cy="17" r="5" fill="#22d3ee" />
    <text x="32" y="22" fill="#a5f3fc" font-size="12" class="font-code" font-weight="600">⚡ Cross-Session MCP</text>
  </g>

  <!-- Bottom Right Pill -->
  <g class="pill-animated-1" transform="translate(945, 344)">
    <rect width="175" height="34" rx="17" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="18" cy="17" r="5" fill="#818cf8" />
    <text x="32" y="22" fill="#c7d2fe" font-size="12" class="font-code" font-weight="600">💾 Persistent State</text>
  </g>

  <!-- FOREGROUND: Crystal Clear, Unobstructed Title, Badges, and Subtitle -->
  <g id="foreground-content">
    <!-- Category Pill Badge -->
    <g transform="translate(435, 68)">
      <rect width="330" height="32" rx="16" fill="#1e1b4b" fill-opacity="0.85" stroke="#6366f1" stroke-width="1.5" />
      <text x="165" y="21" text-anchor="middle" fill="#a5b4fc" font-size="12.5" class="font-code" font-weight="700" letter-spacing="1.2">⚡ THE AGENT MEMORY LANDSCAPE</text>
    </g>

    <!-- Main Title -->
    <text class="font-title" x="600" y="165" text-anchor="middle" font-size="44" fill="url(#titleGradient)">
      AI Agent Memory &amp; Context Persistence
    </text>

    <!-- Subtitle -->
    <text class="font-sub" x="600" y="215" text-anchor="middle" font-size="18" fill="#94a3b8" letter-spacing="0.2">
      Curated Ecosystem of Long-Term Memory Kernels, Temporal Graphs &amp; Session Persistence
    </text>

    <!-- Tech Specs / Highlights Row -->
    <g transform="translate(250, 260)">
      <!-- Item 1 -->
      <g transform="translate(0, 0)">
        <rect width="150" height="44" rx="10" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
        <text x="75" y="27" text-anchor="middle" fill="#e2e8f0" font-size="13" class="font-code">🎯 Semantic Recall</text>
      </g>
      <!-- Item 2 -->
      <g transform="translate(170, 0)">
        <rect width="170" height="44" rx="10" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
        <text x="85" y="27" text-anchor="middle" fill="#e2e8f0" font-size="13" class="font-code">🔄 Stateful Checkpoints</text>
      </g>
      <!-- Item 3 -->
      <g transform="translate(360, 0)">
        <rect width="160" height="44" rx="10" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
        <text x="80" y="27" text-anchor="middle" fill="#e2e8f0" font-size="13" class="font-code">🗄️ Vector &amp; Graph DB</text>
      </g>
      <!-- Item 4 -->
      <g transform="translate(540, 0)">
        <rect width="160" height="44" rx="10" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
        <text x="80" y="27" text-anchor="middle" fill="#e2e8f0" font-size="13" class="font-code">⚡ Coding Agent MCP</text>
      </g>
    </g>
  </g>
</svg>
